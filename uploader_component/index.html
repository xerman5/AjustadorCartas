<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html,body { margin:0; padding:0; background:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202124; }
.wrap { width:100%; }
.drop { border:1px dashed #aaa; border-radius:9px; padding:15px 14px; text-align:center; background:#fafafa; cursor:pointer; transition:.15s; }
.drop:hover,.drop.drag { border-color:#666; background:#f3f3f3; }
.drop.disabled { opacity:.5; cursor:default; }
strong { display:block; margin-bottom:5px; font-size:14px; }
small { color:#666; }
.msg { margin-top:8px; font-size:12px; min-height:18px; }
.ok { color:#237a42; } .err { color:#9d2929; } .muted { color:#666; }
.files { margin-top:9px; max-height:460px; overflow:auto; border:1px solid #e5e5e5; border-radius:8px; background:#fff; }
.file { display:flex; justify-content:space-between; gap:10px; align-items:center; min-height:42px; padding:9px 10px; border-bottom:1px solid #eeeeee; font-size:13px; }
.file:last-child { border-bottom:0; }
.name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.size { color:#666; white-space:nowrap; }
.empty { padding:15px 10px; text-align:center; color:#777; font-size:12px; }
.footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:9px; }
.count { font-size:12px; color:#666; line-height:1.35; }
button { border:0; border-radius:7px; padding:9px 13px; cursor:pointer; font-weight:600; background:#222; color:#fff; }
button:disabled { opacity:.4; cursor:default; }
.badge { display:inline-block; margin-top:6px; padding:3px 7px; border-radius:999px; background:#eee; font-size:11px; color:#555; }
</style>
</head>
<body>
<div class="wrap">
  <div id="drop" class="drop">
    <strong>Selecciona o arrastra tus cartas</strong>
    <small id="help">Selecciona todas las que quieras · JPG, PNG · 12 MB/archivo</small>
    <input id="picker" type="file" multiple hidden accept=".jpg,.jpeg,.png,image/jpeg,image/png">
  </div>
  <div id="msg" class="msg muted"></div>
  <div id="batch" class="badge" style="display:none"></div>
  <div id="files" class="files"><div class="empty">Todavía no hay imágenes seleccionadas.</div></div>
  <div class="footer">
    <div id="count" class="count">0 seleccionadas</div>
    <button id="send" disabled>Subir tanda</button>
  </div>
</div>
<script>
"use strict";

// Streamlit Components v1 protocol, without streamlit-component-lib.
const MSG = {
  READY: "streamlit:componentReady",
  RENDER: "streamlit:render",
  VALUE: "streamlit:setComponentValue",
  HEIGHT: "streamlit:setFrameHeight",
};

function sendMessage(type, data = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
}
function setReady() { sendMessage(MSG.READY, { apiVersion: 1 }); }
function setHeight(height) { sendMessage(MSG.HEIGHT, { height }); }
function setValue(value) { sendMessage(MSG.VALUE, { value, dataType: "json" }); }

const drop = document.getElementById("drop");
const picker = document.getElementById("picker");
const msg = document.getElementById("msg");
const filesEl = document.getElementById("files");
const send = document.getElementById("send");
const countEl = document.getElementById("count");
const helpEl = document.getElementById("help");
const batchEl = document.getElementById("batch");

let config = {
  batch_size: 18,
  max_file_mb: 12,
  accepted_types: ["jpg", "jpeg", "png"],
  advance_token: 0,
  reset_token: 0,
  max_queue_files: 500,
};

let allFiles = [];
let batchIndex = 0;
let queue = [];
let sending = false;
let batchDone = false;
let currentId = null;
let lastAck = "";
let resetToken = null;
let lastAdvanceToken = null;
let announcedDoneKey = "";

function fmtMb(bytes) { return (bytes / 1024 / 1024).toFixed(1) + " MB"; }
function totalMb(files) { return files.reduce((sum, file) => sum + file.size, 0) / 1024 / 1024; }
function setMsg(text, cls = "muted") { msg.className = "msg " + cls; msg.textContent = text; }
function escapeHtml(text) {
  return String(text).replace(/[&<>\"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  })[ch]);
}
function currentBatchFiles() {
  const size = Number(config.batch_size || 18);
  const start = batchIndex * size;
  return allFiles.slice(start, start + size);
}
function totalBatches() {
  const size = Number(config.batch_size || 18);
  return allFiles.length ? Math.ceil(allFiles.length / size) : 0;
}
function render() {
  const current = currentBatchFiles();
  filesEl.innerHTML = "";
  if (!allFiles.length) {
    filesEl.innerHTML = '<div class="empty">Todavía no hay imágenes seleccionadas.</div>';
  } else {
    // La lista visible corresponde siempre a la tanda activa.
    const list = current;
    list.forEach((file, i) => {
      const row = document.createElement("div");
      row.className = "file";
      row.innerHTML = `<span class="name">${escapeHtml(file.name)}</span><span class="size">${fmtMb(file.size)}</span>`;
      filesEl.appendChild(row);
    });
  }

  const batches = totalBatches();
  if (allFiles.length) {
    const currentLabel = Math.min(batchIndex + 1, batches);
    batchEl.style.display = "inline-block";
    batchEl.textContent = `Tanda ${currentLabel} de ${batches} · ${current.length} fotos`;
  } else {
    batchEl.style.display = "none";
  }

  if (sending) {
    countEl.textContent = `Subiendo tanda ${batchIndex + 1}…`;
  } else if (batchDone) {
    const remaining = Math.max(0, allFiles.length - (batchIndex + 1) * Number(config.batch_size || 18));
    countEl.textContent = remaining ? `${remaining} fotos pendientes` : "Última tanda preparada";
  } else {
    countEl.textContent = `${allFiles.length} seleccionadas · ${batches} tanda${batches === 1 ? "" : "s"}`;
  }

  send.disabled = !current.length || sending || batchDone;
  send.textContent = batchDone ? "Tanda preparada" : `Subir tanda ${Math.min(batchIndex + 1, batches || 1)}`;
  drop.classList.toggle("disabled", sending || batchDone);
}

function acceptFiles(fileList) {
  if (sending || batchDone) return;
  const incoming = Array.from(fileList || []);
  if (!incoming.length) return;

  const maxFileBytes = Number(config.max_file_mb || 12) * 1024 * 1024;
  const maxQueue = Number(config.max_queue_files || 500);
  let added = 0;
  const rejected = [];

  for (const file of incoming) {
    if (allFiles.length >= maxQueue) {
      rejected.push(`${file.name}: máximo ${maxQueue} archivos`);
      continue;
    }
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!config.accepted_types.includes(ext)) {
      rejected.push(`${file.name}: formato no válido`);
      continue;
    }
    if (file.size > maxFileBytes) {
      rejected.push(`${file.name}: supera ${config.max_file_mb} MB`);
      continue;
    }
    allFiles.push(file);
    added++;
  }

  picker.value = "";
  render();
  if (rejected.length) {
    setMsg(`${added} añadidas · ${rejected.length} rechazadas`, "err");
  } else if (added) {
    setMsg(`${added} añadidas`, "ok");
  }
  setHeight(Math.max(360, document.documentElement.scrollHeight));
}

function bytesToBase64(bytes) {
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
  }
  return btoa(binary);
}

async function sendNext() {
  if (!queue.length) {
    sending = false;
    currentId = null;
    batchDone = true;
    const doneKey = `${batchIndex}:${allFiles.length}`;
    if (announcedDoneKey !== doneKey) {
      announcedDoneKey = doneKey;
      setValue({
        batch_complete: true,
        batch_index: batchIndex,
        batch_number: batchIndex + 1,
        total_batches: totalBatches(),
      });
    }
    render();
    setMsg(`Tanda ${batchIndex + 1} lista para procesar.`, "ok");
    setHeight(Math.max(360, document.documentElement.scrollHeight));
    return;
  }

  sending = true;
  render();
  const file = queue[0];
  currentId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
  setMsg(`Subiendo ${queue.length} restantes de esta tanda…`, "muted");

  try {
    const buffer = new Uint8Array(await file.arrayBuffer());
    setValue({
      upload_id: currentId,
      name: file.name,
      size: file.size,
      mime: file.type,
      base64: bytesToBase64(buffer),
      batch_index: batchIndex,
      batch_number: batchIndex + 1,
      total_batches: totalBatches(),
    });
  } catch (error) {
    queue.shift();
    currentId = null;
    setMsg(`No se pudo leer ${file.name}.`, "err");
    sendNext();
  }
}

function startBatch() {
  if (sending || batchDone) return;
  const current = currentBatchFiles();
  if (!current.length) return;
  queue = current.slice();
  sendNext();
}

function advanceBatch() {
  if (batchIndex + 1 >= totalBatches()) return;
  batchIndex++;
  queue = [];
  sending = false;
  batchDone = false;
  currentId = null;
  announcedDoneKey = "";
  startBatch();
}

window.addEventListener("message", event => {
  if (!event.data || event.data.type !== MSG.RENDER) return;
  const args = event.data.args || {};
  config = { ...config, ...args };

  helpEl.textContent = `Selecciona todas las que quieras · ${config.max_file_mb} MB/archivo · se separan en tandas de ${config.batch_size}`;

  const token = config.reset_token;
  if (resetToken === null) {
    resetToken = token;
  } else if (token !== resetToken) {
    resetToken = token;
    allFiles = [];
    batchIndex = 0;
    queue = [];
    sending = false;
    batchDone = false;
    currentId = null;
    announcedDoneKey = "";
    render();
    setMsg("", "muted");
  }

  const advance = config.advance_token;
  if (lastAdvanceToken === null) {
    lastAdvanceToken = advance;
  } else if (advance !== lastAdvanceToken) {
    lastAdvanceToken = advance;
    advanceBatch();
  }

  const ack = config.ack_id || "";
  if (ack && ack !== lastAck) {
    lastAck = ack;
    if (currentId === ack) {
      queue.shift();
      currentId = null;
      sendNext();
    }
  }

  render();
  setHeight(Math.max(360, document.documentElement.scrollHeight));
});

drop.addEventListener("click", () => { if (!sending && !batchDone) picker.click(); });
picker.addEventListener("change", event => acceptFiles(event.target.files));
drop.addEventListener("dragover", event => { event.preventDefault(); if (!sending && !batchDone) drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", event => { event.preventDefault(); drop.classList.remove("drag"); if (!sending && !batchDone) acceptFiles(event.dataTransfer.files); });
send.addEventListener("click", startBatch);

setReady();
setHeight(360);
</script>
</body>
</html>
